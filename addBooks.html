<!doctype html>
<body lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
<body>


  <section class="add books">
    <!-- start form -->
    <div class="container py-5">
    <div class="row g-4">
      <div class="col-md-8">
        <div class="card p-4">
          <form class="row g-3">

             <div class="col-12">
              <h1 class="h3 fw-bold mb-2">Add Your Book</h1>
              <p class="text-muted">Share a book with the community and help others learn and grow.</p>
             </div>

           
            <div class="col-12">
              <label for="title" class="form-label">Book Title 
                <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter book title"
                id="title"
                required
              />
            </div>

           
            <div class="col-md-6">
              <label for="Author" class="form-label">Author 
                <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter author name"
                id="Author"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="category" class="form-label">Category 
                <span class="text-danger">*</span>
              </label>
              <select id="category" class="form-select">
                <option selected disabled>Select category</option>
                <option value="1">Novel</option>
                <option value="2">School Books</option>
                 <option value="3">English Books</option>
              </select>
            </div>

             <div class="col-md-6">
              <label for="language" class="form-label">language 
                <span class="text-danger">*</span>
              </label>
              <select id="language" class="form-select">
                <option selected disabled>Select language</option>
                <option value="1">arabic</option>
                <option value="2">english</option>
              </select>
            </div>

             <div class="col-md-6">
              <label for="condition" class="form-label">condition 
                <span class="text-danger">*</span>
              </label>
                <select id="condition" class="form-select" >
                 <option value="" selected disabled>Select condition</option>
                 <option value="like-new">Like New</option>
                 <option value="good">Good</option>
                 <option value="acceptable">Acceptable</option>
                 <option value="poor">Poor</option>
              </select>
            </div>

             <div class="col-md-6">
              <label for="Publish" class="form-label">Publish Year 
                <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                placeholder="e.g.2020"
                id="Publish"
                required
              />
            </div>

             <div class="col-md-6">
             <label for="Pages" class="form-label">Pages 
              <span class="text-danger">*</span>
             </label>
              <input
                type="number"
                class="form-control"
                placeholder="e.g.320"
                id="Pages"
                required
              />
            </div>
            <div class="col-12">
              <label for="bookDescription" class="form-label">
                  Description <span class="text-danger">*</span>
              </label>
               <textarea 
                 class="form-control" 
                 rows="4"
                 minlength="10"
                 maxlength="500" 
                 id="bookDescription"
                 placeholder="Write a short description about the book..."
                 required
                 ></textarea>
               <div class="d-flex justify-content-end mt-1">
                <p class="text-muted" id="charCount">0 / 500</p>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- end form -->

      <!-- start condition guide  -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5>Condition Guide</h5>
          <!-- end condition guide-->
        </div>
      </div>
    </div>
    </div>
  </section>
</body>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </>
</html>
